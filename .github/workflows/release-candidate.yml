name: Windows release candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned cache-check compiler
        run: python -m pip install --disable-pip-version-check --target .build/tools ziglang==0.13.0
      - name: Build, test and verify portable package
        run: python Tests/RemoteArchive/release_gate.py --build --package
      - name: Save reviewable packages
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-remote-windows-x64-candidate
          path: |
            .build/releases/*-windows-x64.zip
            .build/releases/*-windows-x64.zip.sha256
            .build/releases/*-source.zip
            .build/releases/*-source.zip.sha256
          if-no-files-found: error
